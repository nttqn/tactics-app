name: Build Android + iOS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload_ios:
        description: "Also upload the signed iOS build to TestFlight / App Store Connect (needs the Apple secrets)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze || true

      - name: Run tests
        run: flutter test

      # With the four keystore secrets set, the build is signed with the
      # real upload key. Without them this step does nothing and Gradle
      # falls back to the debug key: fine for sideloading, not accepted by
      # the Play Store.
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 secret not set, building a debug-signed APK/AAB. Fine for sideloading, NOT acceptable for a Play Store upload."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

      # ADMOB_APP_ID is optional; without it the build uses the App ID set
      # in android/app/build.gradle.kts.
      - name: Build release APK
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: flutter build apk --release

      # Play Console requires the App Bundle format for uploads.
      - name: Build release App Bundle
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: flutter build appbundle --release

      # Every run's download would otherwise be the same app-release.aab;
      # the version in the name says which build a file is.
      - name: Name the outputs after the version
        run: |
          v=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | tr '+' '-')
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/marchlords-$v.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/marchlords-$v.aab"
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: marchlords-apk-${{ env.VERSION }}
          path: dist/*.apk

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: marchlords-aab-${{ env.VERSION }}
          path: dist/*.aab

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Flutter defaults iOS plugins to Swift Package Manager, which makes
      # each plugin its own package target; those cannot take the manual
      # signing settings used below. CocoaPods embeds plugins into one
      # framework that signs alongside Runner. This is a setting of the
      # Flutter tool, not the project, so it is set on every runner before
      # anything resolves plugins.
      - name: Force CocoaPods instead of Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      # Also generates ios/Podfile, which is not committed.
      - name: Install dependencies
        run: flutter pub get

      # Without this the build fails with "Include of non-modular header
      # inside framework module" from google_mobile_ads. The Runner target
      # gets the same setting from ios/Flutter/*.xcconfig in the repo.
      - name: Patch Podfile (module map fix for google_mobile_ads)
        run: |
          set -e
          test -f ios/Podfile
          perl -0777 -pi -e "s/(flutter_additional_ios_build_settings\(target\))/\$1\n    target.build_configurations.each do |config|\n      config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'\n    end/" ios/Podfile
          grep -n "CLANG_ALLOW_NON_MODULAR" ios/Podfile

      # ios/Runner/Info.plist already carries Marchlords' iOS AdMob App ID
      # (not secret; it ships in the app). The optional ADMOB_APP_ID_IOS
      # secret overrides it.
      - name: Override the AdMob App ID
        env:
          ADMOB_APP_ID_IOS: ${{ secrets.ADMOB_APP_ID_IOS }}
        run: |
          set -e
          if [ -n "${ADMOB_APP_ID_IOS}" ]; then
            plutil -replace GADApplicationIdentifier -string "$ADMOB_APP_ID_IOS" ios/Runner/Info.plist
          fi

      # Automatic signing does not work in headless CI with no device, so
      # this uses manual signing: an Apple Distribution certificate (.p12)
      # and an App Store provisioning profile named "Marchlords App Store".
      # Without the secrets the job still compiles, unsigned, as a check.
      - name: Import signing certificate
        id: ios_signing
        env:
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -e
          if [ -z "$IOS_DIST_P12_BASE64" ] || [ -z "$IOS_PROVISIONING_PROFILE_BASE64" ]; then
            echo "::warning::IOS_DIST_P12_BASE64 / IOS_PROVISIONING_PROFILE_BASE64 not set, building unsigned (compile check only). No .ipa will be produced."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d > ios_profile.mobileprovision
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Install certificate into a temporary keychain
        if: steps.ios_signing.outputs.configured == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_DIST_P12_PASSWORD }}

      # Xcode looks for provisioning profiles in this exact directory.
      - name: Install provisioning profile
        if: steps.ios_signing.outputs.configured == 'true'
        run: |
          set -e
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp ios_profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      # Always runs: resolves CocoaPods and compiles. Signing happens in
      # the archive step.
      - name: Build iOS (compile + resolve pods)
        run: flutter build ios --release --no-codesign

      # These settings must not be passed on the xcodebuild command line:
      # there they apply to every pod target, which fail with "does not
      # support provisioning profiles". Release.xcconfig is read only by
      # the Runner target.
      - name: Configure Runner-only signing settings
        if: steps.ios_signing.outputs.configured == 'true'
        env:
          APPSTORE_TEAM_ID: ${{ secrets.APPSTORE_TEAM_ID }}
        run: |
          set -e
          {
            echo "DEVELOPMENT_TEAM = ${APPSTORE_TEAM_ID}"
            echo "CODE_SIGN_STYLE = Manual"
            echo "CODE_SIGN_IDENTITY = Apple Distribution"
            echo "PROVISIONING_PROFILE_SPECIFIER = Marchlords App Store"
          } >> ios/Flutter/Release.xcconfig

      - name: Archive and export signed IPA
        if: steps.ios_signing.outputs.configured == 'true'
        env:
          APPSTORE_TEAM_ID: ${{ secrets.APPSTORE_TEAM_ID }}
        run: |
          set -e
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${APPSTORE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.trungsmail.marchlords</key>
              <string>Marchlords App Store</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -sdk iphoneos \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/ios/archive/Runner.xcarchive \
            archive
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload IPA artifact
        if: steps.ios_signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: marchlords-ipa
          path: build/ios/ipa/*.ipa

      # Only on a manual run with the box ticked, never on a push: sending
      # a build to App Store Connect should be deliberate.
      - name: Upload to TestFlight
        if: steps.ios_signing.outputs.configured == 'true' && github.event_name == 'workflow_dispatch' && inputs.upload_ios == true
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          set -e
          mkdir -p ~/private_keys
          echo "$APPSTORE_API_KEY_P8" | base64 -d > ~/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8
          xcrun altool --upload-app \
            -f build/ios/ipa/*.ipa \
            -t ios \
            --apiKey "$APPSTORE_API_KEY_ID" \
            --apiIssuer "$APPSTORE_API_ISSUER_ID"
