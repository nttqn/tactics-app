name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze || true

      - name: Run tests
        run: flutter test

      # With the four keystore secrets set, the build is signed with the
      # real upload key. Without them this step does nothing and Gradle
      # falls back to the debug key: fine for sideloading, not accepted by
      # the Play Store.
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 secret not set, building a debug-signed APK/AAB. Fine for sideloading, NOT acceptable for a Play Store upload."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

      # ADMOB_APP_ID is optional; without it the build uses Google's public
      # test App ID and shows test ads only.
      - name: Build release APK
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: flutter build apk --release

      # Play Console requires the App Bundle format for uploads.
      - name: Build release App Bundle
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: flutter build appbundle --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: marchlords-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: marchlords-aab
          path: build/app/outputs/bundle/release/app-release.aab
